<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Defender</title>
  <style>
    body {
      margin: 0;
      background: #0f111a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    h1 { margin-bottom: 8px; color: #64ffda; text-shadow: 0 0 10px #64ffda; }
    p { margin: 4px 0 16px 0; color: #8892b0; }
    canvas {
      border: 2px solid #64ffda;
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
      background: #000;
      border-radius: 6px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>SPACE DEFENDER</h1>
  <p>Use LEFT / RIGHT arrows to Move, SPACEBAR to Shoot</p>
  <canvas id="canvas" width="480" height="400"></canvas>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    let player = { x: 220, y: 360, w: 40, h: 20, speed: 6 };
    let bullets = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let keys = {};

    function initEnemies() {
      enemies = [];
      for(let r = 0; r < 3; r++) {
        for(let c = 0; c < 8; c++) {
          enemies.push({ x: 40 + c * 50, y: 30 + r * 35, w: 30, h: 20, alive: true });
        }
      }
    }
    initEnemies();

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'Space' && !gameOver) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, speed: 7 });
      }
      if(e.code === 'KeyR' && gameOver) {
        gameOver = false;
        score = 0;
        lives = 3;
        scoreEl.innerText = score;
        livesEl.innerText = lives;
        initEnemies();
        bullets = [];
        requestAnimationFrame(loop);
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    let enemyDir = 1;
    let enemyDrop = 0;

    function update() {
      if(keys['ArrowLeft']) player.x = Math.max(0, player.x - player.speed);
      if(keys['ArrowRight']) player.x = Math.min(canvas.width - player.w, player.x + player.speed);

      // Bullets
      bullets.forEach((b, i) => {
        b.y -= b.speed;
        if(b.y < 0) bullets.splice(i, 1);
      });

      // Enemy movement
      let edgeHit = false;
      enemies.forEach(e => {
        if(!e.alive) return;
        e.x += enemyDir * 1.2;
        if(e.x + e.w > canvas.width || e.x < 0) edgeHit = true;
        if(e.y + e.h >= player.y) gameOver = true;
      });

      if(edgeHit) {
        enemyDir = -enemyDir;
        enemies.forEach(e => { e.y += 12; });
      }

      // Collisions
      bullets.forEach((b, bi) => {
        enemies.forEach(e => {
          if(!e.alive) return;
          if(b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.alive = false;
            bullets.splice(bi, 1);
            score += 10;
            scoreEl.innerText = score;
          }
        });
      });

      if(enemies.every(e => !e.alive)) {
        initEnemies();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player
      ctx.fillStyle = '#64ffda';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(player.x + 15, player.y - 8, 10, 8);

      // Bullets
      ctx.fillStyle = '#ff5370';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemies
      ctx.fillStyle = '#f78c6c';
      enemies.forEach(e => {
        if(e.alive) ctx.fillRect(e.x, e.y, e.w, e.h);
      });

      if(gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5370';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      if(!gameOver) {
        update();
        draw();
        requestAnimationFrame(loop);
      } else {
        draw();
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
